name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: src/Fable.Actor/Fable.Actor.fsproj

      - name: Setup declared Erlang/OTP and Rebar
        uses: jdx/mise-action@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Restore dependencies
        run: dotnet tool restore

      # decision: enforces formatting and compiler warnings in CI because both were documented gates nothing enforced
      - name: Check formatting
        run: just format-check

      - name: Build library
        run: dotnet build src/Fable.Actor -warnaserror

      # The shared suite (test/) runs on .NET, Python, JS and BEAM
      - name: Run .NET tests
        run: just test-native

      - name: Run Python tests
        run: just test-python

      - name: Run JS tests
        run: just test-js

      - name: Run BEAM tests
        run: just test-beam

      - name: Test packed command surface
        run: just test-command-package

      - name: Build BEAM library and Timeflies example
        run: just build-timeflies

      # Every example is compiled even when its UI cannot run headless, so an
      # example that no longer builds fails the pull request.
      # invariant: each example directory is compiled by some CI step
      # tradeoff: UI examples are compile-only because they need a browser or server
      - name: Build remaining examples
        run: |
          just build-timeflies-python
          just build-timeflies-js

      - name: Test native Erlang interoperability
        run: just test-interop

      - name: Pack NuGet
        run: just pack
